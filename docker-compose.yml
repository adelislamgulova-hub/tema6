services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    volumes: ["data:/data"]
  jobs:            # фоновые задачи: снятие неоплаченных броней, напоминания, выплаты
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    volumes: ["data:/data"]
    command: ["python", "-m", "flask", "--app", "wsgi", "jobs", "--loop"]
  web:             # HTTPS-терминация и статика (требование: только защищённое соединение)
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./frontend:/srv/frontend:ro", "data:/data:ro", "./deploy/certs:/etc/nginx/certs:ro"]
    depends_on: [api]
volumes: { data: {} }
